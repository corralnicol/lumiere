<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumière Beauty</title>

  <link rel="stylesheet" href="/styles/main.css" />

  <link rel="stylesheet" href="/styles/header.css" />
  <script type="module" src="/js/header.js"></script>

  <script type="module" src="/js/hero.js"></script>
</head>

<body>
  <!-- Header en el que está el logo y aparece en la parte superior de la web -->
  <header class="header-lumiere">
    <div class="degrade">
      <h1 class="logo">Lumière</h1>
    </div>
    <!-- Header en el que está las opciones de la página -->
    <div class="header-bar">
      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
      <nav class="main-nav">
        <a href="#">Shop <i class="fa-solid fa-chevron-down"></i></a>
        <a href="#">On Sale</a>
        <a href="#">Brands</a>
        <a href="#">Categories</a>
        <a href="#">Best Sellers</a>
        <div class="mobile-menu-icons">
          <a href="#" aria-label="Favorites"><i class="fa-regular fa-heart"></i></a>
          <a href="#" aria-label="Cart"><i class="fa-solid fa-shopping-cart"></i></a>
          <a href="#" aria-label="Account"><i class="fa-regular fa-user"></i></a>
        </div>
      </nav>
      <form class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search for products..." />
      </form>
      <div class="header-icons">
        <a href="#"><i class="fa-regular fa-heart"></i></a>
        <a href="#"><i class="fa-solid fa-shopping-cart"></i></a>
        <a href="#"><i class="fa-regular fa-user"></i></a>
      </div>
    </div>
  </header>
  <main>
    <!-- Hero con el banner de loreal paris -->
    <section class="landing-hero">
      <div class="hero-banner">
        <img src="img/banner/loreal.png" alt="L'Oréal Panorama Mascara" class="hero-image">
        <div class="hero-button">
          <a href="#" class="hero-btn">Shop Now</a>
        </div>
      </div>
    </section>

    <!-- Barra de marcas que se ofrecen en la página -->
    <section class="brand-bar">
      <div class="brands-container">
        <a href="https://www.rarebeauty.com/" class="brand-logo-link" target="_blank">
          <img src="img/brands/rare-beauty.svg" alt="Rare Beauty" class="brand-logo logo-rarebeauty">
        </a>
        <a href="https://www.sheglam.com/" class="brand-logo-link" target="_blank">
          <img src="img/brands/sheglam.svg" alt="SHEGLAM" class="brand-logo logo-sheglam">
        </a>
        <a href="https://theordinary.com/en-us" class="brand-logo-link" target="_blank">
          <img src="img/brands/the-ordinary.svg" alt="The Ordinary" class="brand-logo logo-theordinary">
        </a>
        <a href="https://milkmakeup.com/" class="brand-logo-link" target="_blank">
          <img src="img/brands/milk-makeup.svg" alt="Milk Makeup" class="brand-logo logo-milkmakeup">
        </a>
      </div>
    </section>

    <!-- Categorias -->
    <section class="categories">
      <a href="#" class="category-card">
        <div class="category-box">
          <div class="category-img-wrap">
            <img src="img/categories/base.png" alt="Base" class="category-img category-img-base">
          </div>
          <p class="category-name">Base</p>
        </div>
      </a>

      <a href="#" class="category-card">
        <div class="category-box">
          <div class="category-img-wrap">
            <img src="img/categories/concealer.png" alt="Corrector" class="category-img category-img-concealer">
          </div>
          <p class="category-name">Corrector</p>
        </div>
      </a>

      <a href="#" class="category-card">
        <div class="category-box">
          <div class="category-img-wrap">
            <img src="img/categories/blush.png" alt="Blush" class="category-img category-img-blush">
          </div>
          <p class="category-name">Blush</p>
        </div>
      </a>

      <a href="#" class="category-card">
        <div class="category-box">
          <div class="category-img-wrap">
            <img src="img/categories/lip.png" alt="Lip" class="category-img category-img-lip">
          </div>
          <p class="category-name">Lip</p>
        </div>
      </a>
    </section>

    <!-- best sellers -->
    <section class="best-seller-section">
      <h2 class="best-seller-title">Best Sellers</h2>
      <div class="best-seller-grid">

        <!-- Card 1 Eye shadow -->

        <article class="best-card">
          <div class="best-card-image-box">
            <button class="best-card-fav" aria-label="Add to favorites">
              <i class="fa-regular fa-heart"></i> </button>
            <img src="img/best-sellers/eye-shadows.webp" alt="Patrick Ta eyeshadow palette"
              class="best-card-image best-card-image-eyeshadow">
            <div class="best-card-stars">
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-regular fa-star"></i>
            </div>
          </div>
          <div class="best-card-info">
            <h3 class="best-card-name">Patrick ta</h3>
            <p class="best-card-desc">Major Dimension Essential Artistry Edit Eyeshadow Palette</p>
          </div>
        </article>

        <!-- Card 2 the ordinary -->

        <article class="best-card">
          <div class="best-card-image-box">
            <button class="best-card-fav" aria-label="Add to favorites">
              <i class="fa-regular fa-heart"></i> </button>
            <img src="img/best-sellers/sunscreen.webp" alt="The Ordinary sunscreen"
              class="best-card-image best-card-image-serum">
            <div class="best-card-stars">
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
            </div>
          </div>
          <div class="best-card-info">
            <h3 class="best-card-name">The Ordinary</h3>
            <p class="best-card-desc"> Sunscreen SPF 45 </p>
          </div>
        </article>

        <!-- Card 3 Clinique -->

        <article class="best-card">
          <div class="best-card-image-box">
            <button class="best-card-fav" aria-label="Add to favorites">
              <i class="fa-regular fa-heart"></i> </button>
            <img src="img/best-sellers/clinique.webp" alt="Clinique foundation"
              class="best-card-image best-card-image-foundation">
            <div class="best-card-stars">
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
            </div>
          </div>
          <div class="best-card-info">
            <h3 class="best-card-name">Clinique</h3>
            <p class="best-card-desc">Clinique Even Better Liquid Foundation with Vitamins SPF50 30ml</p>
          </div>
        </article>
      </div>
    </section>

    <!--Kits & Sets-->
    <section class="kits-section">
      <h2 class="kits-title">Kits & Sets</h2>

      <div class="kits-grid">
        <article class="kits-card kits-card--tall">
          <img src="img/kits&sets/kit1.svg" alt="Sheglam lip kit">
        </article>

        <article class="kits-card kits-card--top-left">
          <img src="img/kits&sets/kit2.svg" alt="Rare Beauty set">
        </article>

        <article class="kits-card kits-card--top-right">
          <img src="img/kits&sets/kit3.svg" alt="The Ordinary set">
        </article>

        <article class="kits-card kits-card--bottom-left">
          <img src="img/kits&sets/kit4.svg" alt="Milk Makeup set">
        </article>

        <article class="kits-card kits-card--bottom-right">
          <img src="img/kits&sets/kit5.svg" alt="Sol de Janeiro set">
        </article>
      </div>
    </section>
  </main>
</body>

</html>
