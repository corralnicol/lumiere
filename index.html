<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumière Beauty</title>

  <link rel="stylesheet" href="/styles/main.css" />

  <link rel="stylesheet" href="/styles/header.css" />
  <script type="module" src="/js/header.js"></script>

  <script type="module" src="/js/hero.js"></script>
</head>

<body>
  <!-- Header en el que está el logo y aparece en la parte superior de la web -->
  <header class="header-lumiere">
    <div class="degrade">
      <h1 class="logo">Lumière</h1>
    </div>
    <!-- Header en el que está las opciones de la página -->
    <div class="header-bar">
      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
      <nav class="main-nav">
        <a href="#">Shop <i class="fa-solid fa-chevron-down"></i></a>
        <a href="#">On Sale</a>
        <a href="#">Brands</a>
        <a href="#">Categories</a>
        <a href="#">Best Sellers</a>
        <div class="mobile-menu-icons">
          <a href="#" aria-label="Favorites"><i class="fa-regular fa-heart"></i></a>
          <a href="#" aria-label="Cart"><i class="fa-solid fa-shopping-cart"></i></a>
          <a href="#" aria-label="Account"><i class="fa-regular fa-user"></i></a>
        </div>
      </nav>
      <form class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search for products..." />
      </form>
      <div class="header-icons">
        <a href="#"><i class="fa-regular fa-heart"></i></a>
        <a href="#"><i class="fa-solid fa-shopping-cart"></i></a>
        <a href="#"><i class="fa-regular fa-user"></i></a>
      </div>
    </div>
  </header>
  <main>
    <!-- Hero con el banner de loreal paris -->
    <section class="landing-hero">
      <div class="hero-banner">
        <img src="img/banner/loreal.png" alt="L'Oréal Panorama Mascara" class="hero-image">
        <div class="hero-button">
          <a href="#" class="hero-btn">Shop Now</a>
        </div>
      </div>
    </section>

  </main>
</body>

</html>
